name: refresh stats

on:
  schedule:
    # 05:17 UTC daily. An odd minute on purpose: the top of the hour is when
    # every scheduled job on GitHub queues up at once.
    - cron: "17 5 * * *"
  workflow_dispatch:

# No `push` trigger. The job pushes commits itself, and we never want it
# reacting to its own.

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Draw the graphics
        env:
          # The built-in token is enough for public data. No PAT to rotate.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        # Standard library only, so there is nothing to install first.
        run: python3 scripts/generate_stats.py

      - name: Commit, but only if something moved
        run: |
          FILES="stats.svg streak.svg langs.svg"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "nothing changed today"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "stats: refresh profile graphics"
          git push
